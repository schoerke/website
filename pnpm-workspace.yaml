  braces: npm:@dieub/braces-depth-guard@3.0.3-pn.0
  '@modelcontextprotocol/sdk': ^1.32.0
  body-parser: ^2.4.0
  dompurify: ^3.4.17
  esbuild: ^0.28.1
  fast-copy: ^3.1.0
  fast-uri: ^3.1.9
  happy-dom: ^21.0.4
  ip-address: ^10.7.4
  js-cookie: ^3.0.7
  nodemailer: ^10.1.4
  postcss-selector-parser: ^6.1.5
  proxy-addr: ^2.0.8
  source-map-js: ^1.2.2
  undici@6: ^6.29.1
  undici@7: ^7.30.1
