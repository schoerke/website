name: Nightly DB Backup

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC nightly. GH Actions schedule can slip 10-40min under load — acceptable for this job.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes to prod/R2) — defaults to true for manual runs'
        type: boolean
        default: true
      sync_dev:
        description: 'Also refresh ksschoerke-development from the prod backup (destructive to dev, opt-in)'
        type: boolean
        default: false

jobs:
  backup:
    name: Backup prod (dev sync opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 25 # verify_all_tables makes ~2 turso CLI round-trips per table (~40 tables);
    # bumped from 15 to give margin for CLI-startup/auth latency variance.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Turso CLI
        run: curl -sSfL https://get.tur.so/install.sh | bash

      - name: Add Turso CLI to PATH
        run: echo "$HOME/.turso" >> "$GITHUB_PATH"

      - name: Install aws CLI
        run: |
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Run backup (+ optional dev sync)
        env:
          TURSO_PLATFORM_TOKEN: ${{ secrets.TURSO_PLATFORM_TOKEN }}
          BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
          BACKUP_R2_ACCESS_KEY: ${{ secrets.BACKUP_R2_ACCESS_KEY }}
          BACKUP_R2_SECRET: ${{ secrets.BACKUP_R2_SECRET }}
          BACKUP_R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
        run: |
          # Backup-only is the default for every trigger. Dev sync is opt-in and
          # destructive (wipes dev, reloads from prod) - only a manual dispatch with
          # sync_dev=true triggers it. The nightly schedule NEVER syncs dev.
          #
          # The `schedule` trigger always applies for real, regardless of any
          # dry_run input - that input only exists for workflow_dispatch and has no
          # meaning on a schedule-triggered run (github.event.inputs is empty there).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--apply --skip-dev-sync"
          elif [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            ARGS="--apply --skip-dev-sync"
          else
            ARGS="--dry-run --skip-dev-sync"
          fi
          if [ "${{ github.event.inputs.sync_dev }}" = "true" ]; then
            ARGS="--apply"
          fi
          bash scripts/db/backup-and-sync.sh $ARGS
